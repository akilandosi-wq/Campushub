<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#073b66">
<title>CampusHub | Staff Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="app hidden">
  <header class="topbar">
    <div class="top-left">
      <button class="icon-btn mobile-menu" id="menuBtn" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
      <button class="icon-btn" id="backBtn" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
      <div class="top-title"><strong id="pageTitle">Dashboard</strong><span id="roleLabel">Staff portal</span></div>
    </div>
    <div class="top-user"><span class="user-name" id="topName"></span><span class="avatar" id="avatar">T</span></div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="nav-label">STAFF</div>
      <a class="nav-btn" data-page="dashboard" href="#/dashboard"><i class="fa-solid fa-gauge"></i> Dashboard</a>
      <a class="nav-btn" data-page="modules" href="#/modules"><i class="fa-solid fa-book-open"></i> Modules</a>
      <a class="nav-btn" data-page="work" href="#/work"><i class="fa-solid fa-list-check"></i> Assignments &amp; Tests</a>
      <a class="nav-btn" data-page="students" href="#/students"><i class="fa-solid fa-user-graduate"></i> My Students</a>
      <a class="nav-btn hidden" id="usersLink" data-page="users" href="#/users"><i class="fa-solid fa-users-gear"></i> Manage Users</a>
      <a class="nav-btn" href="index.html#/chat"><i class="fa-solid fa-comments"></i> Chat</a>
      <a class="nav-btn" href="index.html#/profile"><i class="fa-solid fa-user"></i> My Profile</a>
      <div class="sidebar-bottom"><button class="nav-btn" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Sign out</button></div>
    </aside>
    <main class="main"><div id="view"></div></main>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
