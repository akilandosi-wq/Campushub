<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CampusHub 3.0</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>

*{box-sizing:border-box}

body{
font:16px system-ui;
margin:0;
background:#f2f5fa;
color:#17243a
}

header{
background:#10233f;
color:white;
padding:20px;
font-size:22px;
font-weight:bold
}

main{
max-width:950px;
margin:25px auto;
padding:12px
}

.card{
background:white;
border-radius:14px;
padding:22px;
margin:14px 0;
box-shadow:0 4px 18px #0001
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:12px
}

input,textarea,select{
width:100%;
padding:11px;
margin:8px 0 14px;
border:1px solid #ccd5e3;
border-radius:8px;
font:inherit
}

button{
background:#2563eb;
color:white;
border:0;
padding:12px 16px;
border-radius:9px;
cursor:pointer;
margin:3px
}

button:disabled{
opacity:.6;
cursor:not-allowed
}

.hidden{
display:none!important
}

.chatbox{
height:220px;
overflow:auto;
background:#f7f9fc;
padding:10px
}

.msg{
padding:8px;
background:white;
margin:6px;
border-radius:8px;
overflow-wrap:anywhere
}

.notice{
color:#2563eb;
font-weight:500;
overflow-wrap:anywhere
}

.secondary{
background:#475569
}

</style>
</head>

<body>

<header>🎓 CampusHub 3.0</header>

<main>

<!-- AUTHENTICATION -->

<section id="auth" class="card">

<h2>Student Login / Registration</h2>

<form id="form">

<label>Email</label>

<input id="email"
type="email"
required
placeholder="Enter your email">

<label>Password (minimum 6 characters)</label>

<input id="password"
type="password"
minlength="6"
required
placeholder="Enter password">

<div id="extra" class="hidden">

<label>Full Name</label>

<input id="name"
placeholder="Your full name">

<label>Course</label>

<input id="course"
placeholder="Your course">

<label>Year of Study</label>

<select id="year">
<option value="1">Year 1</option>
<option value="2">Year 2</option>
<option value="3">Year 3</option>
<option value="4">Year 4</option>
</select>

</div>

<button id="submit" type="submit">
Login
</button>

</form>

<button type="button" id="registerBtn">
Register
</button>

<button type="button" id="loginBtn" class="secondary">
Login
</button>

<p id="notice" class="notice"></p>

</section>


<!-- DASHBOARD -->

<section id="dashboard" class="hidden">

<div class="card">

<h2 id="welcome">Student Dashboard</h2>

<button id="logoutBtn">
Log Out
</button>

</div>


<div class="grid">


<!-- PROFILE -->

<div class="card">

<h3>👤 My Profile</h3>

<label>Full Name</label>

<input id="pname">

<label>Course</label>

<input id="pcourse">

<label>Year</label>

<select id="pyear">
<option value="1">Year 1</option>
<option value="2">Year 2</option>
<option value="3">Year 3</option>
<option value="4">Year 4</option>
</select>

<button id="saveProfileBtn">
Save Profile
</button>

<p id="pn"></p>

</div>


<!-- MODULES -->

<div class="card">

<h3>📚 Modules</h3>

<div id="modules">
Loading modules...
</div>

</div>


<!-- ASSIGNMENTS -->

<div class="card">

<h3>📝 Assignments & Tests</h3>

<div id="work">
Loading work...
</div>

</div>


<!-- CHAT -->

<div class="card">

<h3>💬 Class Chat</h3>

<div id="chat" class="chatbox">
Loading messages...
</div>

<form id="chatform">

<textarea
id="message"
required
maxlength="1000"
placeholder="Message classmates">
</textarea>

<button id="sendBtn" type="submit">
Send Message
</button>

</form>

<p id="cn"></p>

</div>


<!-- SOCIAL LINKS -->

<div class="card">

<h3>🌐 Social Links</h3>

<a href="https://wa.me/">WhatsApp</a> ·

<a href="https://telegram.org/">Telegram</a> ·

<a href="https://x.com/">X</a> ·

<a href="https://instagram.com/">Instagram</a> ·

<a href="https://youtube.com/">YouTube</a> ·

<a href="https://discord.com/">Discord</a> ·

<a href="https://github.com/">GitHub</a>

</div>

</div>

</section>

</main>


<script>

// ======================================
// 1. FIREBASE CONFIGURATION
// ======================================

const firebaseConfig = {

apiKey: "AIzaSyBEi0TxaQpT4q3NE9ljiBlt2FVJYi8zkho",

authDomain: "campushub-a61f7.firebaseapp.com",

projectId: "campushub-a61f7",

storageBucket: "campushub-a61f7.firebasestorage.app",

messagingSenderId: "717964547872",

appId: "1:717964547872:web:5fff690858f0824c502945",

measurementId: "G-WJLQW0GSQ7"

};

firebase.initializeApp(firebaseConfig);

const authService = firebase.auth();

const db = firebase.firestore();


// ======================================
// 2. GLOBAL VARIABLES
// ======================================

const $ = id => document.getElementById(id);

let mode = "login";

let user = null;

let chatListener = null;

let registrationInProgress = false;


// ======================================
// 3. SECURITY
// ======================================

function safe(value){

return String(value ?? "").replace(/[&<>"']/g,c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[c]));

}


// ======================================
// 4. SWITCH LOGIN AND REGISTRATION
// ======================================

function switchMode(value){

mode = value;

$("extra").classList.toggle(
"hidden",
value !== "signup"
);

$("name").required = value === "signup";

$("course").required = value === "signup";

$("submit").textContent =
value === "signup" ? "Create Account" : "Login";

$("notice").textContent = "";

}


// BUTTON EVENTS

$("registerBtn").addEventListener("click",()=>{

switchMode("signup");

});

$("loginBtn").addEventListener("click",()=>{

switchMode("login");

});


// ======================================
// 5. REGISTRATION AND LOGIN
// ======================================

$("form").addEventListener("submit",async e=>{

e.preventDefault();

$("submit").disabled = true;

$("notice").textContent = "Connecting to Firebase...";

try{

const email = $("email").value.trim();

const password = $("password").value;

if(mode === "signup"){

const fullName = $("name").value.trim();

const studentCourse = $("course").value.trim();

if(!fullName || !studentCourse){

throw new Error("Enter your full name and course.");

}

registrationInProgress = true;

const result = await authService
.createUserWithEmailAndPassword(
email,
password
);

const newUser = result.user;


// SAVE STUDENT INFORMATION

await db.collection("students")
.doc(newUser.uid)
.set({

fullName:fullName,

email:email,

course:studentCourse,

year:Number($("year").value),

role:"student",

createdAt:
firebase.firestore.FieldValue.serverTimestamp()

});

user = newUser;

$("notice").textContent =
"Registration successful! Opening dashboard...";

await enterDashboard(newUser);

registrationInProgress = false;

}else{

await authService.signInWithEmailAndPassword(
email,
password
);

}

}catch(error){

registrationInProgress = false;

$("notice").textContent =
"Error: " + error.message;

}finally{

$("submit").disabled = false;

}

});


// ======================================
// 6. AUTOMATIC LOGIN
// ======================================

authService.onAuthStateChanged(async currentUser=>{

if(!currentUser){

user = null;

$("dashboard").classList.add("hidden");

$("auth").classList.remove("hidden");

if(chatListener){

chatListener();

chatListener = null;

}

return;

}

if(registrationInProgress){

return;

}

user = currentUser;

await enterDashboard(currentUser);

});


// ======================================
// 7. STUDENT DASHBOARD
// ======================================

async function enterDashboard(currentUser){

try{

const studentRef = db.collection("students")
.doc(currentUser.uid);

const studentDoc = await studentRef.get();

if(!studentDoc.exists){

$("notice").textContent =
"Student profile missing. Please contact the administrator.";

return;

}

const data = studentDoc.data();

$("welcome").textContent =
"Welcome, " + data.fullName;

$("pname").value = data.fullName || "";

$("pcourse").value = data.course || "";

$("pyear").value = data.year || 1;

$("auth").classList.add("hidden");

$("dashboard").classList.remove("hidden");

loadModules();

loadWork();

loadChat();

}catch(error){

$("notice").textContent = error.message;

}

}


// ======================================
// 8. SAVE PROFILE
// ======================================

$("saveProfileBtn").addEventListener("click",async()=>{

if(!user)return;

$("pn").textContent = "Saving...";

try{

const fullName = $("pname").value.trim();

const course = $("pcourse").value.trim();

if(!fullName || !course){

throw new Error("Name and course are required.");

}

await db.collection("students")
.doc(user.uid)
.update({

fullName:fullName,

course:course,

year:Number($("pyear").value)

});

$("pn").textContent = "Profile saved successfully!";

$("welcome").textContent = "Welcome, " + fullName;

}catch(error){

$("pn").textContent = error.message;

}

});


// ======================================
// 9. LOAD MODULES
// ======================================

async function loadModules(){

$("modules").textContent = "Loading modules...";

try{

const snapshot = await db.collection("modules").get();

let html = "";

snapshot.forEach(doc=>{

const x = doc.data();

html += `

<div class="msg">

<b>${safe(x.module_code)}</b>

— ${safe(x.module_name)}

</div>

`;

});

$("modules").innerHTML =
html || "No modules published yet.";

}catch(error){

$("modules").textContent = error.message;

}

}


// ======================================
// 10. LOAD ASSIGNMENTS AND TESTS
// ======================================

async function loadWork(){

$("work").textContent = "Loading work...";

try{

const results = await Promise.all([

db.collection("assignments").get(),

db.collection("tests").get()

]);

let html = "";

results[0].forEach(doc=>{

const x = doc.data();

html += `

<div class="msg">

📝 <b>${safe(x.title)}</b>

<br>

Due: ${safe(x.due_date || "")}

</div>

`;

});

results[1].forEach(doc=>{

const x = doc.data();

html += `

<div class="msg">

🧪 <b>${safe(x.title)}</b>

<br>

Date: ${safe(x.test_date || "")}

</div>

`;

});

$("work").innerHTML =
html || "No assignments or tests published yet.";

}catch(error){

$("work").textContent = error.message;

}

}


// ======================================
// 11. REAL-TIME CLASS CHAT
// ======================================

function loadChat(){

if(chatListener){

chatListener();

}

$("chat").textContent = "Loading messages...";

chatListener = db.collection("chatMessages")

.orderBy("createdAt")

.limitToLast(100)

.onSnapshot(snapshot=>{

let html = "";

snapshot.forEach(doc=>{

const x = doc.data();

html += `

<div class="msg">

<b>${x.userId === user.uid ? "You" : "Student"}:</b>

${safe(x.message)}

</div>

`;

});

$("chat").innerHTML =
html || "No messages yet. Start the conversation!";

$("chat").scrollTop =
$("chat").scrollHeight;

},error=>{

$("chat").textContent = error.message;

});

}


// ======================================
// 12. SEND CHAT MESSAGE
// ======================================

$("chatform").addEventListener("submit",async e=>{

e.preventDefault();

if(!user)return;

const text = $("message").value.trim();

if(!text)return;

$("sendBtn").disabled = true;

try{

await db.collection("chatMessages").add({

userId:user.uid,

message:text,

createdAt:
firebase.firestore.FieldValue.serverTimestamp()

});

$("message").value = "";

$("cn").textContent = "Message sent!";

}catch(error){

$("cn").textContent = error.message;

}finally{

$("sendBtn").disabled = false;

}

});


// ======================================
// 13. LOGOUT
// ======================================

$("logoutBtn").addEventListener("click",async()=>{

try{

await authService.signOut();

location.reload();

}catch(error){

alert(error.message);

}

});

</script>

</body>
</html>
