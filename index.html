<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusHub 3.0</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="authPage" class="auth-page">
  <div class="auth-card">
    <div class="logo">CH</div>
    <p class="brand">CAMPUSHUB 3.0</p>
    <h1 id="authTitle">Welcome Back</h1>
    <p class="sub">Your academic life, all in one place.</p>

    <form id="authForm">
      <div id="registerFields" class="hidden">
        <label>Full name</label>
        <input id="fullName" placeholder="Your full name">

        <label>Phone number</label>
        <input id="phone" type="tel" placeholder="+255...">

        <label>Registration number</label>
        <input id="regNo" placeholder="Registration number">

        <label>Course / Programme</label>
        <input id="course" placeholder="Your programme">

        <label>Year of study</label>
        <select id="year">
          <option value="">Select year</option>
          <option>Year 1</option>
          <option>Year 2</option>
          <option>Year 3</option>
          <option>Year 4</option>
          <option>Year 5</option>
        </select>
      </div>

      <label>Email address</label>
      <input id="email" type="email" required placeholder="Email address">

      <label>Password</label>
      <input id="password" type="password" required minlength="6" placeholder="Password">

      <button class="main-btn" id="submitBtn" type="submit">Login</button>
    </form>

    <p class="switch">
      <span id="switchText">Don't have an account?</span>
      <button id="switchBtn" type="button">Register</button>
    </p>

    <p id="authMessage"></p>
  </div>
</div>

<div id="portal" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="side-logo">CH <span>CampusHub</span></div>

    <div class="student-mini">
      <div class="avatar" id="avatar">S</div>
      <div>
        <b id="studentName">Student</b>
        <small id="studentCourse">Student portal</small>
      </div>
    </div>

    <nav>
      <button onclick="showPage('home')">▦ Overview</button>
      <button onclick="showPage('profile')">◉ My Profile</button>
      <button onclick="showPage('modules')">▤ My Modules</button>
      <button onclick="showPage('work')">✓ Assignments & Tests</button>
      <button onclick="showPage('chat')">◌ Class Chat</button>
    </nav>

    <button class="logout" onclick="logout()">Sign out</button>
  </aside>

  <main class="main">
    <header>
      <button class="menu" onclick="toggleMenu()">☰</button>
      <div>
        <small>STUDENT PORTAL</small>
        <h2 id="pageTitle">Overview</h2>
      </div>
      <span class="secure">● Secure</span>
    </header>

    <section id="pageContent"></section>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
