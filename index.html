<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusHub 3.0</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:16px system-ui;margin:0;background:#f2f5fa;color:#17243a}header{background:#10233f;color:white;padding:20px;font-size:22px;font-weight:bold}main{max-width:950px;margin:25px auto;padding:12px}.card{background:white;border-radius:14px;padding:22px;margin:14px 0;box-shadow:0 4px 18px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}input,textarea,select{width:100%;padding:11px;margin:8px 0 14px;border:1px solid #ccd5e3;border-radius:8px;box-sizing:border-box}button{background:#2563eb;color:white;border:0;padding:12px 16px;border-radius:9px;cursor:pointer}.hidden{display:none}.chatbox{height:220px;overflow:auto;background:#f7f9fc;padding:10px}.msg{padding:8px;background:white;margin:6px;border-radius:8px}</style></head><body><header>🎓 CampusHub 3.0</header><main>
<section id="auth" class="card"><h2>Student login / registration</h2><form id="form"><label>Email</label><input id="email" type="email" required><label>Password (minimum 6 characters)</label><input id="password" type="password" minlength="6" required><div id="extra" class="hidden"><label>Full name</label><input id="name"><label>Course</label><input id="course"><label>Year</label><select id="year"><option>1</option><option>2</option><option>3</option><option>4</option></select></div><button id="submit">Login</button></form><button onclick="mode='signup';extra.classList.remove('hidden');submit.textContent='Register'">Switch to registration</button> <button onclick="mode='login';extra.classList.add('hidden');submit.textContent='Login'">Switch to login</button><p id="notice"></p></section>
<section id="dashboard" class="hidden"><div class="card"><h2 id="welcome">Dashboard</h2><button onclick="logout()">Log out</button></div><div class="grid"><div class="card"><h3>My profile</h3><label>Name</label><input id="pname"><label>Course</label><input id="pcourse"><label>Year</label><select id="pyear"><option>1</option><option>2</option><option>3</option><option>4</option></select><button onclick="saveProfile()">Save profile</button><p id="pn"></p></div><div class="card"><h3>Modules</h3><div id="modules">Loading…</div></div><div class="card"><h3>Assignments & tests</h3><div id="work">Loading…</div></div><div class="card"><h3>Class chat</h3><div id="chat" class="chatbox"></div><form id="chatform"><textarea id="message" required maxlength="1000" placeholder="Message classmates"></textarea><button>Send</button></form><p id="cn"></p></div><div class="card"><h3>Social links</h3><a href="https://wa.me/">WhatsApp</a> · <a href="https://telegram.org/">Telegram</a> · <a href="https://x.com/">X</a> · <a href="https://instagram.com/">Instagram</a> · <a href="https://youtube.com/">YouTube</a> · <a href="https://discord.com/">Discord</a> · <a href="https://github.com/">GitHub</a></div></div></section></main>
<script>
const sb=supabase.createClient("https://sjczautqlvdhulweaag.supabase.co","sb_publishable_gi24oDiNH4kRUZIDWI-7_Q_NKa8K6CF");let mode="login",user;
form.onsubmit=async e=>{e.preventDefault();notice.textContent="Please wait…";let r=mode==="signup"?await sb.auth.signUp({email:email.value,password:password.value,options:{data:{full_name:name.value}}}):await sb.auth.signInWithPassword({email:email.value,password:password.value});if(r.error){notice.textContent=r.error.message;return}if(mode==="signup"&&!r.data.session){notice.textContent="Account created. Check email to confirm, then log in.";return}await enter(r.data.user)};
async function enter(u){user=u;await sb.from("profiles").upsert({id:u.id,full_name:u.user_metadata?.full_name||u.email.split("@")[0]},{onConflict:"id"});auth.classList.add("hidden");dashboard.classList.remove("hidden");welcome.textContent="Welcome, "+u.email;let {data}=await sb.from("profiles").select("*").eq("id",u.id).maybeSingle();pname.value=data?.full_name||"";pcourse.value=data?.course||"";pyear.value=data?.year_of_study||1;load();chatload();sb.channel("messages").on("postgres_changes",{event:"INSERT",schema:"public",table:"chat_messages"},chatload).subscribe()}
async function saveProfile(){let r=await sb.from("profiles").upsert({id:user.id,full_name:pname.value,course:pcourse.value,year_of_study:+pyear.value});pn.textContent=r.error?.message||"Saved!"}
async function load(){let m=await sb.from("modules").select("*");modules.innerHTML=m.error?m.error.message:(m.data||[]).map(x=>`<p>${x.module_code} — ${x.module_name}</p>`).join("")||"No modules published yet.";let a=await sb.from("assignments").select("title,due_date"),t=await sb.from("tests").select("title,test_date");work.innerHTML=[...(a.data||[]).map(x=>`<p>📝 ${x.title} — ${x.due_date||""}</p>`),...(t.data||[]).map(x=>`<p>🧪 ${x.title} — ${x.test_date||""}</p>`)].join("")||"No work published yet."}
async function chatload(){let r=await sb.from("chat_messages").select("message,user_id,created_at").order("created_at").limit(100);chat.innerHTML=(r.data||[]).map(x=>`<div class="msg"><b>${x.user_id===user.id?"You":"Student"}:</b> ${String(x.message).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}</div>`).join("");chat.scrollTop=chat.scrollHeight}
chatform.onsubmit=async e=>{e.preventDefault();let r=await sb.from("chat_messages").insert({user_id:user.id,message:message.value.trim()});cn.textContent=r.error?.message||"";if(!r.error){message.value="";chatload()}}
async function logout(){await sb.auth.signOut();location.reload()}sb.auth.getSession().then(x=>{if(x.data.session)enter(x.data.session.user)});
</script></body></html>
